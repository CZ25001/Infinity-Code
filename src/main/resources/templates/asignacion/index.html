<html lang="en"
      xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<div layout:fragment="content">

    <!-- Mostrar mensaje de confirmacion en caso de exio -->
    <div th:if="${msg != null}">
        <script>
            Swal.fire(
                {
                    title : "Confirmacion",
                    text: '[[${msg}]]',
                    icon: "success"
                }
            );
        </script>
    </div>

    <!-- Mostrar mensaje en caso de error -->
    <div th:if="${error != null}">
        <script>
            Swal.fire(
                {
                    title : "Error",
                    text: '[[${error}]]',
                    icon: "error"
                }
            );
        </script>
    </div>

    <h1>Listado de asignaciones Docente - Grupo</h1>
    <a th:href="@{/asignaciones/create}" class="btn btn-outline-primary">Nueva Asignacion</a>
    <table class = "table table-striped">
        <thead>
        <th>Año</th>
        <th>Ciclo</th>
        <th>Docente</th>
        <th>Escuela</th>
        <th>Grupo</th>
        <th>Acciones</th>
        </thead>
        <tbody>
        <tr th:each="item : ${asignaciones}">
            <td th:text="${item.getAnio()}"></td>
            <td th:text="${item.getCiclo()}"></td>
            <td th:text="|${item.docente.getNombre()} ${item.docente.getApellido()}|"></td>
            <td th:text="${item.docente.getEscuela()}"></td>
            <td th:text="${item.grupo.getNombre()}"></td>
            <td>
                <a th:href="@{ /asignaciones/details/{id} (id= ${item.getId()}) }"
                   class="btn btn-outline-primary">Detalles</a>
                <a th:href="@{ /asignaciones/edit/{id} (id = ${item.getId()})  }"
                   class="btn btn-outline-success">Editar</a>
                <a th:href="@{ /asignaciones/remove/{id} (id = ${item.getId()})  }"
                   class="btn btn-outline-danger">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <nav aria-label="Page navigation example">
        <ul class="pagination">
            <li class="page-item" th:each="pageNumber : ${pageNumbers}">
                <a class="page-link" th:href="@{|/grupos?page=${pageNumber}|}"
                   th:text = "${pageNumber}"></a>
            </li>
        </ul>
    </nav>
</div>
