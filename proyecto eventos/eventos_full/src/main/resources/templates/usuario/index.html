<html lang="en"
      xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<div layout:fragment="content">

    <!-- Mostrar mensaje de confirmacion en caso de exito -->
    <div th:if="${msg != null}">
        <script>
            Swal.fire(
                {
                    title : "Confirmacion",
                    text: '[[${msg}]]',
                    icon: "success"
                }
            );
        </script>
    </div>

    <!-- Mostrar mensaje en caso de error -->
    <div th:if="${error != null}">
        <script>
            Swal.fire(
                {
                    title : "Error",
                    text: '[[${error}]]',
                    icon: "error"
                }
            );
        </script>
    </div>

    <h1>Listado de Usuarios</h1>
    <a th:href="@{/usuarios/create}" class="btn btn-outline-primary">Nuevo Usuario</a>
    <table class="tab table-striped">
        <thead>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Email</th>
        <th>Telefono</th>
        <th>Estado</th>
        <th>Rol</th>
        </thead>
        <tbody>
        <tr th:each="item : ${usuarios}">
            <td th:text="${item.getNombre()}"></td>
            <td th:text="${item.getApellido()}"></td>
            <td th:text="${item.getEmail()}"></td>
            <td th:text="${item.getTelefono()}"></td>
            <td>
            <span th:if="${item.getEstado()}" class="badge bg-success">Activo</span>
            <span th:unless="${item.getEstado()}" class="badge bg-danger">Inactivo</span>
            </td>
            <td th:text="${item.getRol().getNombre()}"></td>
            <td>
                <a th:href="@{ /usuarios/details/{id} (id= ${item.getId()}) }"
                   class="btn btn-outline-primary">Detalles</a>
                <a th:href="@{ /usuarios/edit/{id} (id = ${item.getId()})  }"
                   class="btn btn-outline-success">Editar</a>
                <a th:href="@{ /usuarios/remove/{id} (id = ${item.getId()})  }"
                   class="btn btn-outline-danger">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>
