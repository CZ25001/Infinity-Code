<html lang="en"
      xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<div layout:fragment="content">

<h1>Crear Nuevo Grupo</h1>
<form th:action="@{/grupos/save}" th:object="${grupo}" method="post">
    <div class="row">
        <div class="col-md-6">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" class="form-control" th:field="*{nombre}"
                       id="nombre" placeholder="Escriba un nombre de grupo" required>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <div class="form-group">
                <label for="descripcion">Descripcion</label>
                <textarea class="form-control" th:field="*{descripcion}" id="descripcion"
                          cols="12" rows="3" required></textarea>
            </div>
        </div>
    </div>
    <hr>
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a th:href="@{/grupos}" class="btn btn-dark">Regresar</a>
</form>

</div>
