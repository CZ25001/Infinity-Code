<html lang="en"
      xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<div layout:fragment="content">

    <h1>Detalle del grupo</h1>

    <div>
        <hr>
        <dl class="row">
            <dt class="col-sm-2">Nombre</dt>
            <dd class="col-sm-10" th:text="${grupo.nombre}"></dd>

            <dt class="col-sm-2">Descripcion</dt>
            <dd class="col-sm-10" th:text="${grupo.descripcion}"></dd>
        </dl>

        <a th:href="@{/grupos/edit/{id} (id= ${grupo.id}) }" class="btn btn-success">Editar</a>
        <a th:href="@{/grupos}" class="btn btn-dark">Regresar</a>
    </div>
</div>
